version: '3.9'
services:
  aivisspeech:
    image: ghcr.io/aivis-project/aivisspeech-engine:nvidia-1.3.0-dev@sha256:13c4b15a345d6431b9d9660e6981116465ec77e633725761cdd75ad6d6fa396c
    hostname: aivisspeech
    container_name: aivisspeech__aivisspeech
    restart: unless-stopped

    networks:
      - default

    volumes:
      - type: bind
        source: ./AivisSpeech-Engine
        target: /home/user/.local/share/AivisSpeech-Engine-Dev

    deploy:
      resources:
        limits:
          memory: 16g
        reservations:
          devices:
            - driver: nvidia
              # Fix for docker-ce 27.3.x bugs.
              # refs:
              #   https://x.com/yanorei32/status/1840455188928405554
              #   https://github.com/moby/moby/pull/48483
              #   https://docs.docker.com/compose/how-tos/gpu-support/
              count: all
              capabilities: [gpu]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0-amd64@sha256:1a50cc8893b3f0dd283805d2efcd3336210aced60a83d967fb2bbc8ab69b5f35
    hostname: cloudflared
    container_name: aivisspeech__cloudflared
    restart: unless-stopped

    environment:
      TUNNEL_METRICS: 0.0.0.0:9126
      TUNNEL_LOGFILE: /dev/stdout

    command: tunnel run --token ${TUNNEL_TOKEN}
    user: root

    networks:
      default:

    deploy:
      resources:
        limits:
          memory: 128m

networks:
  default:
    name: aivisspeech__default
