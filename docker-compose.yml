version: '3.9'
services:
  aivisspeech:
    image: ghcr.io/aivis-project/aivisspeech-engine:nvidia-1.3.0-dev@sha256:9015656be6dad29af680029f882680821d20b1c13a6c49e1a90d69b5b19568f2
    hostname: aivisspeech
    container_name: aivisspeech__aivisspeech
    restart: unless-stopped

    networks:
      - default

    volumes:
      - type: bind
        source: ./AivisSpeech-Engine
        target: /home/user/.local/share/AivisSpeech-Engine-Dev

    deploy:
      resources:
        limits:
          memory: 16g
        reservations:
          devices:
            - driver: nvidia
              # Fix for docker-ce 27.3.x bugs.
              # refs:
              #   https://x.com/yanorei32/status/1840455188928405554
              #   https://github.com/moby/moby/pull/48483
              #   https://docs.docker.com/compose/how-tos/gpu-support/
              count: all
              capabilities: [gpu]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7-amd64@sha256:32f933aa6fe1f69c5885b93f3c92cc3f60cca8f0530868bc3bc2cc446114a385
    hostname: cloudflared
    container_name: aivisspeech__cloudflared
    restart: unless-stopped

    environment:
      TUNNEL_METRICS: 0.0.0.0:9126
      TUNNEL_LOGFILE: /dev/stdout

    command: tunnel run --token ${TUNNEL_TOKEN}
    user: root

    networks:
      default:

    deploy:
      resources:
        limits:
          memory: 128m

networks:
  default:
    name: aivisspeech__default
